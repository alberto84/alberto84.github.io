experience:
  - role: Researcher
    org: Institute for High Performance Computing and Networking (ICAR-CNR), Italian National Research Council
    start: 2025-01-02
    summary: |
      Research title: Study of methods and models for vulnerability identification through the analysis of both user behavior (and its variation over time) and security events and information.
      
      The research activity aims to analyze Machine/Deep Learning techniques and models for the design of monitoring and intelligent maintenance tools for the identification and rapid reporting of patterns and anomalies in complex systems. Additionally, the study and definition of signatures and models based on machine learning techniques for the identification of covert channels for information hiding within the PNRR SERICS research project.

      
  - role: Researcher (Research Grant, art. 24 c.3-a L. 240/10)
    org: University of Calabria
    start: 2022-01-01
    end: 2024-12-31
    summary: |
      Research title: Innovative techniques and models for predictive maintenance in Smart Industry.
      
      The research activity aimed to define techniques and models for predictive maintenance of production systems integrated with IoT systems. Through monitoring of production lines, the defined techniques and models are able to identify in advance the occurrence of failures and/or malfunctions. In order to achieve high accuracy and flexibility, two complementary approaches to predictive maintenance were investigated: (i) data-driven; (ii) model-based. The first (data-driven), starting from monitoring data produced by sensors, employs machine learning and deep learning techniques to predict possible failure/malfunction situations and/or decrease in system capabilities, thus allowing the definition of appropriate countermeasures. The second (model-based), focuses on the possible use of a digital twin of the operating system that, fed by monitoring data from sensors and reproducing its architecture and behavior, will allow, through simulation and co-simulation techniques, not only to predict the future evolution of the system but also to evaluate in advance the consequences of failures or malfunctions as well as those of corrective and/or evolutionary maintenance interventions.
      
