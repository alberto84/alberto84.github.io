bio: |
  Alberto Falcone is a researcher at the Institute for High Performance Computing and Networking of the Italian National Research Council (ICAR-CNR). He received a PhD in Systems and Computer Engineering from the University of Calabria (Italy).
  
  In 2016, he was a visiting researcher at NASA Johnson Space Center (JSC), working with the [Software, Robotics, and Simulation Division (ER)](https://www.nasa.gov/software-robotics-and-simulation-division/).
  
  He co-authored over 50 papers published in international conference proceedings, chapters and journals. His research mainly focuses on Large Language Models, Cybersecurity, Software Engineering, and Distributed Simulation.
  
  He is an Associate Editor for the Journal [SIMULATION: Transactions of The Society for Modeling and Simulation International](https://journals.sagepub.com/home/sim).

